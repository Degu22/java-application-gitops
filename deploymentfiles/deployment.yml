---
apiVersion: apps/v1
kind: Deployment
metadata: 
  name: dev-app
  labels:
    app: dev-deploy

spec:
  replicas: 3
  selector:
    matchLabels: 
      app: dev-deploy

  template:
    metadata:
      labels: 
       app: dev-deploy
    spec:
      containers:
        - name: dev-container
          image: deviprasad7781/gitops:6
          ports: 
           - containerPort: 8080           
